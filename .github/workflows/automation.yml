name: Telus OTP Automation

on:
  workflow_dispatch:
    inputs:
      parallel_jobs:
        description: 'Number of parallel jobs (1-10)'
        required: false
        default: '3'
      accounts_per_job:
        description: 'Accounts per job (1-30)'
        required: false
        default: '10'

jobs:
  otp-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_index: 0
          - job_index: 1
          - job_index: 2
          - job_index: 3
          - job_index: 4
          - job_index: 5
          - job_index: 6
          - job_index: 7
          - job_index: 8
          - job_index: 9
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg curl unzip
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb x11-utils libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Display environment
        run: |
          echo "Job Index: ${{ matrix.job_index }}"
          echo "Parallel Jobs: ${{ inputs.parallel_jobs }}"
          echo "Accounts per Job: ${{ inputs.accounts_per_job }}"
          python --version

      - name: Run Telus Automation
        run: |
          # Calculate offset based on job index
          OFFSET=$(( ${{ matrix.job_index }} * ${{ inputs.accounts_per_job }} ))
          LIMIT=${{ inputs.accounts_per_job }}
          echo "Starting Job ${{ matrix.job_index }} with offset $OFFSET and limit $LIMIT accounts"
          export ACCOUNT_OFFSET=$OFFSET
          export ACCOUNT_LIMIT=$LIMIT
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python telus_gh.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otp-results-job-${{ matrix.job_index }}
          path: |
            otp_tracking.json
          retention-days: 7