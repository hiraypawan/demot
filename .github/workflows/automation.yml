name: Telus OTP Automation

on:
  workflow_dispatch:
    inputs:
      parallel_jobs:
        description: 'Number of parallel jobs (1-3)'
        required: false
        default: '1'
      accounts_per_job:
        description: 'Accounts per job (1-30)'
        required: false
        default: '1'

jobs:
  otp-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job_index: [0, 1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg curl unzip
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb x11-utils libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Telus Automation
        run: |
          # Only run if this job index is within the requested parallel_jobs
          if [ ${{ matrix.job_index }} -lt ${{ inputs.parallel_jobs }} ]; then
            OFFSET=$(( ${{ matrix.job_index }} * ${{ inputs.accounts_per_job }} ))
            LIMIT=${{ inputs.accounts_per_job }}
            echo "Running Job ${{ matrix.job_index }} (offset: $OFFSET, limit: $LIMIT)"
            export JOB_INDEX=${{ matrix.job_index }}
            export ACCOUNT_OFFSET=$OFFSET
            export ACCOUNT_LIMIT=$LIMIT
            export GITHUB_ACTIONS=true
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python telus_gh.py
          else
            echo "Skipping Job ${{ matrix.job_index }} (not in range 0-${{ inputs.parallel_jobs }})"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otp-results-job-${{ matrix.job_index }}
          path: |
            otp_tracking.json
          retention-days: 7