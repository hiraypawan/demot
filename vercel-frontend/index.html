<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telus Automation Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
            color: #00d4ff;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #aaa;
            font-size: 14px;
        }

        .status {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-family: monospace;
            font-size: 12px;
            min-height: 60px;
        }

        .config {
            margin-bottom: 20px;
        }

        .config label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .config input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 14px;
        }

        .config input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-start {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #fff;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-start:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-check {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-size: 14px;
            padding: 10px;
        }

        .btn-check:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }

        .job-counter {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .job-counter div {
            text-align: center;
        }

        .job-counter span {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #00d4ff;
        }

        .job-counter label {
            font-size: 11px;
            color: #aaa;
        }

        .github-link {
            text-align: center;
            margin-top: 15px;
        }

        .github-link a {
            color: #666;
            font-size: 12px;
            text-decoration: none;
        }

        .github-link a:hover {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Telus Automation</h1>
        <p class="subtitle">GitHub Actions Control Panel</p>

        <div class="status" id="status">
            Ready to start automation...
        </div>

        <div class="config">
            <label>GITHUB Personal Access Token (PAT)</label>
            <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
        </div>

        <div class="config">
            <label>Repository (owner/repo)</label>
            <input type="text" id="repo" placeholder="yourusername/telus-bot">
        </div>

        <button class="btn-start" id="startBtn" onclick="startAutomation()">
            🚀 Start Automation
        </button>

        <button class="btn-check" onclick="checkWorkflowStatus()">
            📊 Check Status
        </button>

        <div class="job-counter">
            <div>
                <span id="totalJobs">20</span>
                <label>Parallel Jobs</label>
            </div>
            <div>
                <span id="totalAccounts">300</span>
                <label>Total Accounts</label>
            </div>
            <div>
                <span id="perJob">15</span>
                <label>Accounts/Job</label>
            </div>
        </div>

        <div class="github-link">
            <a href="https://github.com/features/actions" target="_blank">Powered by GitHub Actions</a>
        </div>

        <div class="info">
            ⚠️ Make sure your repo is PUBLIC for free minutes
        </div>
    </div>

    <script>
        const DEFAULT_ACCOUNTS_PER_JOB = 15;
        const DEFAULT_TOTAL_JOBS = 20;
        const DEFAULT_TOTAL_ACCOUNTS = 300;

        document.getElementById('totalJobs').textContent = DEFAULT_TOTAL_JOBS;
        document.getElementById('totalAccounts').textContent = DEFAULT_TOTAL_ACCOUNTS;
        document.getElementById('perJob').textContent = DEFAULT_ACCOUNTS_PER_JOB;

        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.style.color = isError ? '#ff6b6b' : '#00d4ff';
            status.textContent = message;
        }

        async function startAutomation() {
            const token = document.getElementById('token').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const startBtn = document.getElementById('startBtn');

            if (!token) {
                updateStatus('❌ Please enter your GitHub PAT token', true);
                return;
            }

            if (!repo) {
                updateStatus('❌ Please enter your repository (owner/repo)', true);
                return;
            }

            startBtn.disabled = true;
            startBtn.textContent = '⏳ Starting...';

            try {
                updateStatus('🚀 Triggering GitHub Actions workflow...');

                const response = await fetch(`https://api.github.com/repos/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'workflow_dispatch',
                        inputs: {
                            accounts_per_job: DEFAULT_ACCOUNTS_PER_JOB.toString(),
                            total_jobs: DEFAULT_TOTAL_JOBS.toString()
                        }
                    })
                });

                if (response.ok) {
                    updateStatus(`✅ Successfully triggered ${DEFAULT_TOTAL_JOBS} parallel jobs!\nEach job will process ${DEFAULT_ACCOUNTS_PER_JOB} accounts.`);
                    startBtn.textContent = '✅ Started!';
                } else {
                    const error = await response.json();
                    updateStatus(`❌ Error: ${error.message || response.statusText}`, true);
                    startBtn.disabled = false;
                    startBtn.textContent = '🚀 Start Automation';
                }
            } catch (error) {
                updateStatus(`❌ Network error: ${error.message}`, true);
                startBtn.disabled = false;
                startBtn.textContent = '🚀 Start Automation';
            }
        }

        async function checkWorkflowStatus() {
            const token = document.getElementById('token').value.trim();
            const repo = document.getElementById('repo').value.trim();

            if (!token || !repo) {
                updateStatus('❌ Please enter token and repo to check status', true);
                return;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github+json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.workflow_runs && data.workflow_runs.length > 0) {
                        const run = data.workflow_runs[0];
                        const status = run.conclusion || run.status;
                        updateStatus(`📊 Latest run: ${run.name}\nStatus: ${status}\nJobs: ${run.run_number}`);
                    } else {
                        updateStatus('No recent workflow runs found');
                    }
                } else {
                    updateStatus('❌ Could not fetch workflow status', true);
                }
            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
